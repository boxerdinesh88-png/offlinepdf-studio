name: Build OfflinePDF Studio

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Create venv
        run: python -m venv .venv
      - name: Install dependencies
        run: |
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r requirements.lock
          .venv\Scripts\python -m pip install "PyInstaller==6.22.3"
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Regenerate icons
        run: .venv\Scripts\python scripts\make_icon.py
      - name: Offline check
        run: .venv\Scripts\python scripts\check_offline.py
      - name: Run tests
        run: .venv\Scripts\python -m pytest -q
        continue-on-error: true
      - name: Build installer
        run: build_installer.bat /nopause
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OfflinePDF-Studio-Windows
          path: release/*

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Create venv
        run: python3 -m venv .venv
      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.lock
          .venv/bin/python -m pip install "PyInstaller==6.22.3"
      - name: Regenerate icons
        run: .venv/bin/python scripts/make_icon.py
      - name: Offline check
        run: .venv/bin/python scripts/check_offline.py
      - name: Run tests
        run: .venv/bin/python -m pytest -q
        continue-on-error: true
      - name: Build DMG
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh --no-pause
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: OfflinePDF-Studio-macOS
          path: release/*