[project]
name = "offlinepdf-studio"
version = "0.2.0"
description = "Fully offline desktop PDF editor with automatic style matching"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later (see THIRD_PARTY_LICENSES.md for bundled component licenses)" }

[project.scripts]
offlinepdf = "offlinepdf.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["vendor", "build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "SIM108", # ternary suggestions are often less readable
    "RUF001", # ambiguous unicode in user-facing strings is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
show_error_codes = true
ignore_errors = false
exclude = ["vendor", "build", "dist"]

[[tool.mypy.overrides]]
module = ["pymupdf.*", "fitz.*", "reportlab.*", "pikepdf.*", "fontTools.*", "numpy.*", "PIL.*", "rapidocr_onnxruntime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running corpus generation or performance tests",
]
